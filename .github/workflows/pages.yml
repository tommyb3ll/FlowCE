name: Web page

# Publishes the FlowCE page (site/) on GitHub Pages, with the latest release's FlowCE.b84 for its
# web installer, and the steps build: FlowCE-steps.b84 from the newest release that has one (a
# beta is a prerelease, which "latest" skips). Runs when the page or its media change, and when a
# release is published.
# A release's run cannot deploy itself: it runs on the tag, and the github-pages environment only
# takes main. So it starts this workflow on main instead (workflow_dispatch), which deploys.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Start the page's deployment on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the page with the latest release and the steps build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern FlowCE.b84 --dir "$RUNNER_TEMP"
          steps=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select((.draft | not) and any(.assets[]; .name == "FlowCE-steps.b84"))][0].tag_name // empty')
          if [ -n "$steps" ]; then
            mkdir -p "$RUNNER_TEMP/steps"
            gh release download "$steps" --repo "$GITHUB_REPOSITORY" --pattern FlowCE-steps.b84 --dir "$RUNNER_TEMP/steps"
            bash site/build.sh "$RUNNER_TEMP/FlowCE.b84" "$tag" "$RUNNER_TEMP/steps/FlowCE-steps.b84" "$steps"
          else
            bash site/build.sh "$RUNNER_TEMP/FlowCE.b84" "$tag"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
